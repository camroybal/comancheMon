# =============================================================================
#  COMANCHE // MJ-4.0 TERRAIN MONITOR
#  Amber-phosphor vehicle terminal for the Hosyond / LCDWiki ES3C35P
#  (ESP32-S3 N16R8, 320x480 ST77922 QSPI panel, ST7123 touch)
#
#  Hardware reference .... docs/HARDWARE.md
#  Driver inventory ...... docs/DRIVERS.md
#  Build / flash ......... docs/BUILD.md
#  Performance notes ..... docs/PERFORMANCE.md
#  Jeep model notes ...... docs/MODEL.md
# =============================================================================

substitutions:
  name: comanche-monitor
  friendly_name: Comanche Monitor
  fw_version: "0.2.0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "MJ-4.0 terrain monitor"
  includes:
    - comanche_ui.h
  on_boot:
    # 600 runs after the LEDC output (800) and light state (799) are ready.
    # GPIO41 is active HIGH and mipi_spi has no backlight support.
    - priority: 600
      then:
        - light.turn_on:
            id: backlight
            brightness: 100%
        - lambda: id(g_mesh_last_us) = cm::us();

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  flash_mode: qio
  cpu_frequency: 240MHz
  partitions: partitions.csv
  framework:
    type: esp-idf
    advanced:
      # PERF keeps the LVGL/software-rotation loops fast; SIZE is the ESPHome
      # default but leaves measurable frame time on the table.
      compiler_optimization: PERF
      assertion_level: DISABLE
      # Only build the generic SPI flash driver.  The board's Zbit part works
      # with it and this frees IRAM, which is the tightest memory region here.
      flash_chip: generic
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHFREQ_80M: "y"
      # 64 KB data cache is useful because LVGL reads masks and draw buffers
      # out of PSRAM during software rotation.
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_FREERTOS_HZ: "1000"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  logs:
    lvgl: WARN
    display: WARN
    wifi: WARN
    api: WARN
    mdns: WARN

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 0s          # standalone dash: never reboot because Wi-Fi is down
  ap:
    ssid: "Comanche-Monitor"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
      key: !secret api_key

# ----------------------------------------------------------------- hardware
spi:
  - id: lcd_bus
    type: quad
    clk_pin: GPIO12
    data_pins: [GPIO11, GPIO13, GPIO14, GPIO9]

i2c:
  - id: bus_a
    sda: GPIO38
    scl: GPIO39
    frequency: 400kHz

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO41          # active HIGH
    frequency: 1000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_OFF   # on_boot drives it

display:
  - platform: mipi_spi
    id: lcd
    spi_id: lcd_bus
    model: CUSTOM
    bus_mode: quad
    cs_pin: GPIO10
    # 40 MHz is comfortably inside the ST77922's 62.5 MHz QSPI write limit
    # (16 ns serial clock cycle, datasheet section 7.4.5).  80 MHz is out of
    # specification and the panel is already fast enough at 40 MHz.
    data_rate: 40MHz
    update_interval: never
    dimensions:
      width: 320         # NATIVE portrait; LVGL does the 270 rotation
      height: 480
    color_order: RGB
    invert_colors: true
    draw_rounding: 4
    # The MADCTL hardware-rotation path does not take on this unit (image comes
    # out sideways). Software rotation costs CPU per flushed rectangle but is
    # correct on every ST77922 revision. Verified on hardware.
    transform: disabled
    <<: !include st77922-init-sequence.yaml

touchscreen:
  - platform: st7123
    id: touch
    i2c_id: bus_a
    address: 0x55
    reset_pin: GPIO48
    display: lcd

