# ------------------------------------------------------------------- update
interval:
  # Fast loop: only the moving NAV instruments and the three attitude
  # readouts.  Hidden pages are not touched.
  - interval: 100ms
    startup_delay: 4500ms
    then:
      - lambda: |-
          const float t = (float) (cm::us() / 1000000.0);
          id(g_speed)   = 62.0f + 3.0f * sinf(t * 0.31f) + 0.8f * sinf(t * 1.7f);
          id(g_heading) = 311.0f + 4.0f * sinf(t * 0.11f);
          id(g_alt)     = 4020.0f + 8.0f * sinf(t * 0.21f);
          id(g_temp)    = 196.0f + 3.0f * sinf(t * 0.13f);
          id(g_oil)     = 42.0f + 1.5f * sinf(t * 0.19f);
          id(g_volt)    = 13.8f + 0.15f * sinf(t * 0.7f);
          id(g_rpm)     = 2140.0f + 120.0f * sinf(t * 0.33f);
          id(g_lat)    += 0.0000025f * cosf(t * 0.05f);
          id(g_lon)    += 0.0000025f * sinf(t * 0.05f);
          id(g_fuel)    = 70.0f - fmodf(t * 0.004f, 8.0f);
          id(g_pitch)   = 8.0f * sinf(t * 0.7f);
          id(g_yaw)     = 1.2f * sinf(t * 0.9f);
          id(g_roll)    = 12.0f * sinf(t * 0.4f);
          id(g_vac)     = 18.4f + 1.3f * sinf(t * 0.23f);
          id(g_tps)     = 0.82f + 0.05f * sinf(t * 0.5f);
          id(g_o2)      = 0.45f + 0.33f * sinf(t * 2.1f);
          id(g_iac)     = 32.0f + 4.0f * sinf(t * 0.17f);
          id(g_timing)  = 13.5f + 4.0f * sinf(t * 0.11f);
          id(g_sats)    = 9;
          id(g_hdop)    = 0.8f;

          if (id(g_page) == 0) {
            const int spd = (int) lroundf(id(g_speed));
            const int sbase = (spd / 20) * 20;
            const int soff = (int) lroundf((spd - sbase) / 20.0f * 30.0f);
            if (sbase != id(g_speed_base)) {
              char buf[48];
              char *p = buf;
              for (int k = 3; k >= -3; k--) {
                int v = sbase + k * 20;
                if (v < 0) v = 0;
                p += snprintf(p, sizeof(buf) - (p - buf), "%d", v);
                if (k > -3) *p++ = '\n';
              }
              *p = 0;
              cm::text_raw(id(speed_tape), buf);
              id(g_speed_base) = sbase;
            }
            cm::y(id(speed_tape), 29 + soff);
            lv_obj_t *major[] = {id(spd_tick0), id(spd_tick1), id(spd_tick2),
                                 id(spd_tick3), id(spd_tick4), id(spd_tick5),
                                 id(spd_tick6)};
            lv_obj_t *minor[] = {id(spd_min0), id(spd_min1), id(spd_min2),
                                 id(spd_min3), id(spd_min4), id(spd_min5)};
            for (int k = 0; k < 7; k++)
              cm::y(major[k], 35 + soff + 30 * k);
            for (int k = 0; k < 6; k++)
              cm::y(minor[k], 50 + soff + 30 * k);
            cm::text(id(speed_digital), "%03d", spd);

            const int alt = (int) lroundf(id(g_alt));
            const int abase = (alt / 100) * 100;
            const int aoff = (int) lroundf((alt - abase) / 100.0f * 30.0f);
            if (abase != id(g_alt_base)) {
              char buf[48];
              char *p = buf;
              for (int k = 3; k >= -3; k--) {
                int v = abase + k * 100;
                if (v < 0) v = 0;
                p += snprintf(p, sizeof(buf) - (p - buf), "%d", v);
                if (k > -3) *p++ = '\n';
              }
              *p = 0;
              cm::text_raw(id(alt_tape), buf);
              id(g_alt_base) = abase;
            }
            cm::y(id(alt_tape), 29 + aoff);
            lv_obj_t *amajor[] = {id(alt_tick0), id(alt_tick1), id(alt_tick2),
                                  id(alt_tick3), id(alt_tick4), id(alt_tick5),
                                  id(alt_tick6)};
            lv_obj_t *aminor[] = {id(alt_min0), id(alt_min1), id(alt_min2),
                                  id(alt_min3), id(alt_min4), id(alt_min5)};
            for (int k = 0; k < 7; k++)
              cm::y(amajor[k], 35 + aoff + 30 * k);
            for (int k = 0; k < 6; k++)
              cm::y(aminor[k], 50 + aoff + 30 * k);
            cm::text(id(alt_digital), "%d,%03d", alt / 1000, alt % 1000);

            const int heading = ((int) lroundf(id(g_heading)) % 360 + 360) % 360;
            const int arc = ((int) lroundf(id(g_heading) / 10.0f) % 36 + 36) % 36;
            if (arc != id(g_arc_idx)) {
              id(g_arc_idx) = arc;
              auto *img = id(compass_map).get(arc);
              lv_image_set_src(id(compass_card_img), img->get_lv_image_dsc());
            }
            static const char *pts[] = {"N", "NE", "E", "SE", "S", "SW", "W", "NW"};
            cm::text(id(arc_heading), "%03d° %s", heading, pts[((heading + 22) / 45) % 8]);

            cm::text(id(gauge_roll_title), "ROLL %+.1f°", id(g_roll));
            cm::text(id(gauge_pitch_title), "PITCH %+.1f°", id(g_pitch));
            cm::rot(id(gauge_roll_truck), id(g_roll));
            cm::rot(id(gauge_pitch_truck), -id(g_pitch));

            cm::check(id(ind_speed), id(g_speed) > 85.0f);
            cm::check(id(ind_temp), id(g_temp) > 220.0f);
            cm::check(id(ind_tilt), fabsf(id(g_pitch)) > 6.0f || fabsf(id(g_roll)) > 9.0f);
          }

  # UI text / bars at 4 Hz.  This touches hidden labels too, so every page is
  # current the instant it is shown; the expensive NAV drawing stays above.
  - interval: 250ms
    startup_delay: 4500ms
    then:
      - lambda: |-
          cm::text(id(diag_cool), "%d F", (int) lroundf(id(g_temp)));
          cm::text(id(diag_vac), "%.1f IN", id(g_vac));
          cm::text(id(diag_tps), "%.2f V", id(g_tps));
          cm::text(id(diag_o2), "%.2f V", id(g_o2));
          cm::text(id(diag_iac), "%d", (int) lroundf(id(g_iac)));
          cm::text(id(diag_timing), "%.1f°", id(g_timing));

          cm::text(id(eng_val), "%d°F", (int) lroundf(id(g_temp)));
          cm::text(id(oil_val), "%d PSI", (int) lroundf(id(g_oil)));
          cm::text(id(bat_val), "%.1f V", id(g_volt));
          cm::text(id(fuel_val), "%d%%", (int) lroundf(id(g_fuel)));
          cm::text(id(rpm_val), "%d", (int) lroundf(id(g_rpm)));
          cm::bar(id(eng_bar), (id(g_temp) - 120.0f) / 1.4f);
          cm::bar(id(oil_bar), id(g_oil) / 0.8f);
          cm::bar(id(bat_bar), (id(g_volt) - 10.0f) / 0.06f);
          cm::bar(id(fuel_bar), id(g_fuel));
          cm::bar(id(rpm_bar), id(g_rpm) / 60.0f);
          cm::text(id(eng_status), id(g_temp) > 220.0f ? "HOT" : "OK");
          cm::text(id(oil_status), id(g_oil) < 20.0f ? "LOW" : "OK");
          cm::text(id(bat_status), id(g_volt) < 12.5f ? "LOW" : "CHG");
          cm::text(id(fuel_status), "%d", (int) lroundf(id(g_fuel) * 4.6f));
          cm::text(id(rpm_status), "4X4");

          cm::text(id(hero_pitch), "%+.1f°", id(g_pitch));
          cm::text(id(hero_roll), "%+.1f°", id(g_roll));
          cm::text(id(hero_yaw), "%03d°", ((int) lroundf(id(g_heading)) % 360 + 360) % 360);

          cm::text(id(sens_pitch), "%+.1f°", id(g_pitch));
          cm::text(id(sens_yaw), "%+.1f°", id(g_yaw));
          cm::text(id(sens_roll), "%+.1f°", id(g_roll));
          cm::text(id(sens_cool), "%d F", (int) lroundf(id(g_temp)));
          cm::text(id(sens_oil), "%d PSI", (int) lroundf(id(g_oil)));
          cm::text(id(sens_fuel), "%d%%", (int) lroundf(id(g_fuel)));
          cm::text(id(sens_volt), "%.1f V", id(g_volt));
          cm::text(id(sens_sats), "%02d", id(g_sats));
          cm::text(id(sens_hdop), "%.1f", id(g_hdop));

          cm::text(id(mesh_rssi), "%d dBm", id(g_mesh_rssi));
          cm::text(id(mesh_snr), "%.1f dB", id(g_mesh_snr));
          cm::text(id(mesh_hops), "%d", id(g_mesh_hops));
          cm::text(id(mesh_nodes), "%d", id(g_mesh_nodes));
          const int packets = id(g_mesh_packets);
          cm::text(id(mesh_packets), "%d,%03d", packets / 1000, packets % 1000);
          uint64_t age = (cm::us() - id(g_mesh_last_us)) / 1000000ULL;
          if (age > 5999) age = 5999;
          cm::text(id(mesh_last), "%02u:%02u", (unsigned) (age / 60), (unsigned) (age % 60));

  # Serial waterfall: one token every 300 ms.
  - interval: 300ms
    startup_delay: 4500ms
    then:
      - lambda: |-
          static const char *S[] = {
            "BOOT OK", "HEAP142K", "PSRAM 8M", "GPS 3D", "IMU100HZ",
            "I2C 0x55", "TOUCH OK", "WIFI-67", "MESH RX", "UART115K",
            "NVS OK", "LVGL OK", "RENIX OK", "FUEL 68%", "OIL 42P",
            "TEMP196F", "HDOP 0.8", "SATS 09", "PKT12844", "ERR0.02",
            "LOG 001", "WDOG OK", "ALT 4020", "HDG 311"
          };
          const size_t n = sizeof(S) / sizeof(S[0]);
          auto count = [](const std::string &v) {
            int c = 0;
            for (char ch : v) if (ch == '\n') c++;
            return c;
          };
          auto pop_last = [](std::string &v) {
            if (!v.empty() && v.back() == '\n') v.pop_back();
            auto p = v.rfind('\n');
            std::string out = (p == std::string::npos) ? v : v.substr(p + 1);
            if (p == std::string::npos) v.clear(); else v.erase(p);
            return out;
          };
          id(g_serial_new) = std::string(S[id(g_serial_idx) % n]) + "\n" + id(g_serial_new);
          id(g_serial_idx)++;
          while (count(id(g_serial_new)) > 6)
            id(g_serial_mid) = pop_last(id(g_serial_new)) + "\n" + id(g_serial_mid);
          while (count(id(g_serial_mid)) > 6)
            id(g_serial_old) = pop_last(id(g_serial_mid)) + "\n" + id(g_serial_old);
          while (count(id(g_serial_old)) > 6)
            pop_last(id(g_serial_old));
          if (id(g_page) <= 1) {
            cm::text_raw(id(serial_new), id(g_serial_new).c_str());
            cm::text_raw(id(serial_mid), id(g_serial_mid).c_str());
            cm::text_raw(id(serial_old), id(g_serial_old).c_str());
          }

  # Slower board health, clocks and network state.
  - interval: 1s
    startup_delay: 4500ms
    then:
      - lambda: |-
          const uint32_t s = cm::seconds();
          cm::text(id(hdr_mission), "T+ %02u:%02u:%02u",
                   (unsigned) (s / 3600), (unsigned) ((s / 60) % 60), (unsigned) (s % 60));
          cm::text(id(sys_uptime), "%02u:%02u:%02u",
                   (unsigned) (s / 3600), (unsigned) ((s / 60) % 60), (unsigned) (s % 60));
          cm::text(id(sys_heap), "%d KB", cm::internal_kb());
          const int pk = cm::psram_kb();
          cm::text(id(sys_psram), "%d.%d MB", pk / 1024, (pk % 1024) * 10 / 1024);
          if (std::isnan(id(wifi_rssi).state))
            cm::text(id(sys_rssi), "--");
          else
            cm::text(id(sys_rssi), "%d dBm", (int) lroundf(id(wifi_rssi).state));
          const char *ip = id(wifi_ip).state.c_str();
          cm::text_raw(id(sys_ip), ip[0] ? ip : "0.0.0.0");
          cm::text(id(sens_mesh), "RX %d.%d KB/S", 12, (int) (s % 10));
          cm::text(id(comms_rate), "%d.%d KB/S", 12, (int) (s % 10));

  # Mesh feed.
  - interval: 2s
    startup_delay: 4500ms
    then:
      - lambda: |-
          static const char *M[] = {
            "[M01] K7ABC: ridge road clear",
            "[M02] N0CALL: camp is up",
            "[M03] W1XYZ: 2 hops, strong",
            "[M04] K7ABC: fuel at 68%",
            "[M05] N0CALL: copy that",
            "[M06] W1XYZ: moving to 191",
            "[M07] K7ABC: gate open",
            "[M08] N0CALL: need water",
            "[M09] W1XYZ: rssi -67",
            "[M10] K7ABC: holding here"
          };
          const size_t n = sizeof(M) / sizeof(M[0]);
          id(g_mesh_log) += M[id(g_mesh_idx) % n];
          id(g_mesh_log) += "\n";
          id(g_mesh_idx)++;
          int lines = 0;
          for (char c : id(g_mesh_log)) if (c == '\n') lines++;
          while (lines > 10) {
            auto p = id(g_mesh_log).find('\n');
            if (p == std::string::npos) break;
            id(g_mesh_log).erase(0, p + 1);
            lines--;
          }
          id(g_mesh_last_us) = cm::us();
          id(g_mesh_packets) += 3;
          id(g_mesh_rssi) = -67 + (int) lroundf(2.0f * sinf(cm::seconds() / 3.0f));
          id(g_mesh_snr) = 8.2f + 0.6f * sinf(cm::seconds() / 5.0f);
          id(g_mesh_nodes) = 14;
          id(g_mesh_hops) = 2 + (int) (cm::seconds() / 60) % 2;
          cm::text_raw(id(mesh_log), id(g_mesh_log).c_str());

